name: Arda Güler gol/asist kontrolü

# Her koşu ~5,5 saat boyunca maçları izler, bitince kendini yeniden başlatır (kesintisiz izleme).
# Cron sadece zincir koparsa yeniden başlatmak için yedek.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: arda-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Maçları izle ve bildir
        env:
          NTFY_TOPIC: arda-guler-gol-mmk34
        run: |
          git config user.name "arda-bot"
          git config user.email "arda-bot@users.noreply.github.com"
          python3 bot/check.py

      - name: Zinciri sürdür
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --repo "${{ github.repository }}" --ref main
